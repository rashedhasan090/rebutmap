[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rebutmap"
version = "0.1.0"
description = "Map every reviewer comment to its response and verify the revised paper backs up what the response letter claims."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Md Rashedul Hasan" }]
requires-python = ">=3.8"
keywords = ["peer review", "rebuttal", "response letter", "latex", "research productivity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Intended Audience :: Science/Research",
]

[project.scripts]
rebutmap = "rebutmap.cli:main"

[tool.setuptools]
packages = ["rebutmap"]
